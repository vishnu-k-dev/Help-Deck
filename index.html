const GUIDE=`
<div class="guide">
<h3>Composition</h3>
<p><b>Rule of Thirds</b> — Divide the frame into a 3×3 grid; place subjects on the lines or intersections.</p>
<p><b>Golden Ratio / Spiral</b> — Fibonacci-based guidance for balance and flow; the spiral leads the eye to a focal point.</p>
<p><b>Leading lines & Symmetry</b> — Diagonals and armature lines reveal the frame's underlying geometry.</p>
<p><b>Negative Space</b> — Empty areas that give the subject room to breathe.</p>
<h3>Exposure</h3>
<p><b>False Color</b> — Maps luminance to color zones so you can judge exposure at a glance.</p>
<p><b>Clipping</b> — Bright red marks near-white detail loss; deep blue marks crushed shadows.</p>
<p><b>Midtones & Skin</b> — Aim key skin tones into the pink/green exposure zone (≈40–60%).</p>
<h3>Framing</h3>
<p><b>2.39:1</b> anamorphic scope · <b>2.00:1</b> Univisium · <b>1.85:1</b> flat · <b>16:9</b> HDTV · <b>4:3</b> Academy · <b>1:1</b> square.</p>
<h3>Color</h3>
<p><b>Warm vs cool</b> — the temperature estimate compares red vs blue energy. <b>Contrast</b>, <b>saturation</b> and the <b>dominant palette</b> summarize the frame's color character. All values are visual estimates, not calibrated measurements.</p>
</div>`;
function openHelp(tab){
  els.helpModal.classList.add('open');
  showHelpTab(tab||'short');
}
function showHelpTab(tab){
  els.helpTitle.textContent = tab==='guide'?'Cinematography Guide':'Keyboard Shortcuts';
  if(tab==='guide'){ els.helpBody.innerHTML=GUIDE; }
  else{
    els.helpBody.innerHTML='<div class="kbd-grid">'+SHORTCUTS.map(([k,d])=>`<div class="k"><span>${d}</span><kbd>${k}</kbd></div>`).join('')+'</div>';
  }
}

/* ============================================================
   Toolbar / global bindings
   ============================================================ */
function bindToolbar(){
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener('click',fn);};
  on('btnOpen',()=>els.fileInput.click());
  on('emptyOpen',()=>els.fileInput.click());
  on('btnSample',()=>loadSample());
  on('emptySample',()=>loadSample());
  on('btnCamera',toggleCamera);
  on('emptyCamera',()=>startCamera());
  on('liveCapture',captureFrame);
  on('liveFlip',flipCamera);
  on('liveTorch',toggleTorch);
  on('liveStop',()=>stopCamera(false));
  on('btnUndo',undo); on('btnRedo',redo);
  on('btnZoomIn',()=>zoomBy(1.25)); on('btnZoomOut',()=>zoomBy(0.8));
  on('zoomVal',()=>fitToScreen());
  on('btnFit',fitToScreen); on('btn100',()=>setScale(1));
  on('btnCompare',toggleCompare); on('btnFocus',toggleFocus);
  on('btnFull',toggleFullscreen); on('btnReset',resetWorkspace);
  on('btnHelp',()=>openHelp('short')); on('btnExport',exportPNG);
  on('btnSavePreset',saveCurrentPreset);
  on('helpClose',()=>els.helpModal.classList.remove('open'));
  on('helpTabShort',()=>showHelpTab('short')); on('helpTabGuide',()=>showHelpTab('guide'));
  els.presetSelect.addEventListener('change',e=>{
    const v=e.target.value; if(!v){return;}
    if(v.startsWith('user:')){ const p=loadUserPresets()[v.slice(5)]; if(p)applyPreset(p); }
    else if(BUILTIN_PRESETS[v]) applyPreset(BUILTIN_PRESETS[v]);
    e.target.value='';
  });
  els.helpModal.addEventListener('click',e=>{ if(e.target===els.helpModal)els.helpModal.classList.remove('open'); });
  els.fileInput.addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f)loadFile(f); e.target.value=''; });
  // mobile
  els.mtabs.addEventListener('click',e=>{ const b=e.target.closest('[data-sheet]'); if(!b)return;
    if(els.sidebar.classList.contains('open') && b.classList.contains('on'))closeSheet(); else openSheet(b.dataset.sheet); });
  els.scrim.addEventListener('click',closeSheet);
}
function bindGlobal(){
  window.addEventListener('keydown',onKey);
  window.addEventListener('keyup',e=>{ if(e.key===' ')spaceDown=false; });
  window.addEventListener('blur',()=>{spaceDown=false;});
}
/* Drag & drop anywhere */
function bindDrop(){
  let depth=0;
  const show=on=>els.stage.classList.toggle('dragover',on);
  window.addEventListener('dragover',e=>{e.preventDefault();});
  window.addEventListener('dragenter',e=>{e.preventDefault();depth++;show(true);});
  window.addEventListener('dragleave',e=>{depth=Math.max(0,depth-1);if(!depth)show(false);});
  window.addEventListener('drop',e=>{
    e.preventDefault();depth=0;show(false);
    const files=e.dataTransfer&&e.dataTransfer.files;
    if(files&&files.length){ const img=[...files].find(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp)$/i.test(f.name)); if(img)loadFile(img); else toast('Drop a JPG, PNG, or WEBP image.','err'); }
  });
}

/* ============================================================
   Self-test (dev sanity check for core math)
   ============================================================ */
function selfTest(){
  try{
    console.assert(rgbToHex(255,0,16)==='#FF0010','hex');
    console.assert(medianCut([[0,0,0],[255,255,255],[10,10,10],[240,240,240]],2).length===2,'medianCut');
    console.assert(Math.round(lumaPct(255,255,255))===100 && Math.round(lumaPct(0,0,0))===0,'luma');
    const savedImg=state.img,oldA=state.frame.aspect;
    state.img={natW:1920,natH:1080};state.frame.aspect='2.39';
    const c=getCropImage();
    console.assert(Math.abs(c.w-1920)<1 && Math.abs(c.h-1920/2.39)<2,'crop 2.39');
    state.img=savedImg;state.frame.aspect=oldA;
  }catch(e){/* non-fatal */}
}

/* ============================================================
   Init
   ============================================================ */
function init(){
  loadSettings();
  state.overlaysMuted=false;
  buildSidebar(); bindSidebar(); loadNotes(); afterBuild();
  bindToolbar(); bindGlobal(); bindDrop();
  refreshPresetSelect();
  initHistory();
  const ro=new ResizeObserver(()=>{ resizeCanvas(); if(state.img){state.view.fitted?fitToScreen():(clampPan(),requestRender());} });
  ro.observe(els.viewport);
  resizeCanvas();
  selfTest();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init); else init();

</script>
